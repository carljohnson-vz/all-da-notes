<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Da Notes</title>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;font-family:"Segoe UI",system-ui,sans-serif;}
  body{
    display:flex;flex-direction:column;
    --bg:#eef0f6; --panel:#fff; --panel2:#f7f8fc; --ink:#1f2430; --muted:#6b7280;
    --line:#e4e7ef; --accent:#6750f2; --accent-soft:#ece9ff; --sel:#e9e6ff;
    --shadow:0 1px 3px rgba(20,20,40,.08); --shadow-lg:0 10px 30px rgba(20,20,40,.18);
    --radius:12px; --canvas:#f3f4fa; --grid:#e3e5ef;
    background:var(--bg);color:var(--ink);
  }
  /* The #app wrapper must continue the flex column so .panes can fill the viewport;
     without this it collapses to content height and growing content pushes the nav down. */
  #app{display:flex;flex-direction:column;height:100%;min-height:0;}
  .topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);}
  .logo{width:24px;height:24px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;}
  .topbar h1{font-size:15px;margin:0;font-weight:650;}
  .brand{display:flex;flex-direction:column;line-height:1.15;}
  .version{font-size:13px;color:var(--muted);}
  .update-status{padding:8px 14px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);}
  .searchbox{position:relative;flex:0 0 260px;}
  .search{width:100%;padding:8px 46px 8px 32px;border:1px solid var(--line);border-radius:9px;color:var(--ink);font-size:13px;
    background:var(--panel2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%239aa' stroke-width='2'><circle cx='7' cy='7' r='5'/><path d='M11 11l4 4'/></svg>") 9px 50% no-repeat;}
  .search:disabled{opacity:.5;}
  .search-count{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none;}
  ::highlight(search-hl){background:#ffe08a;color:#1f2430;}
  .spacer{flex:1;}
  .status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);}
  .status .dot{width:8px;height:8px;border-radius:50%;background:#9aa;}
  .status.saved .dot{background:#34a853;} .status.saving .dot{background:#f5a623;} .status.unsaved .dot{background:#e0697a;}
  #restoreBtn,#openBtn{padding:7px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;cursor:pointer;font-size:13px;}
  #restoreBtn{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;}
  #restoreBtn:hover,#openBtn:hover{border-color:var(--accent);}
  #banner{display:none;width:100%;padding:9px 16px;background:#fde7e9;border-bottom:1px solid #f1707b;color:#6e0811;font-size:13px;}

  .panes{flex:1;display:flex;min-height:0;}
  .col{display:flex;flex-direction:column;min-height:0;}
  .col-nav{flex:0 0 210px;background:var(--panel2);border-right:1px solid var(--line);}
  .col-pages{flex:0 0 230px;background:var(--panel);border-right:1px solid var(--line);}
  .col-editor{flex:1;min-width:0;background:var(--canvas);}
  .col-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;}
  .col-head button{width:22px;height:22px;border:none;border-radius:6px;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;line-height:1;}
  .col-head button:hover{background:var(--accent-soft);color:var(--accent);}
  .list{overflow-y:auto;flex:1 1 0;min-height:0;padding:2px 8px;}
  .item{padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer;margin-bottom:2px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .item:hover{background:var(--accent-soft);}
  .item.selected{background:var(--sel);color:var(--accent);font-weight:600;}
  .item .menu{opacity:0;border:none;background:transparent;cursor:pointer;font-size:13px;color:inherit;}
  .item:hover .menu{opacity:.7;}

  .titlebar{padding:14px 22px 6px;background:var(--panel);}
  #pageTitle{width:100%;font-size:22px;font-weight:700;border:none;background:transparent;color:var(--ink);outline:none;}
  #pageTitle:disabled{color:var(--muted);}
  .toolbar{display:flex;gap:4px;padding:6px 18px 10px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap;}
  .toolbar button{min-width:32px;height:30px;padding:0 8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;cursor:pointer;font-size:13px;}
  .toolbar button:hover{border-color:var(--accent);color:var(--accent);}
  .toolbar input[type=color]{width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--panel);}

  /* canvas: own scroll, content cannot escape to the page body (Bug #1 structural fix) */
  .canvasWrap{flex:1 1 0;min-height:0;overflow:auto;}
  /* the page fills the whole editor area (full width + height), not a fixed A4 card */
  .page{position:relative;width:100%;min-height:100%;background:#fff;
    background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:24px 24px;}
  .page.disabled{opacity:.5;pointer-events:none;}
  .block{position:absolute;border-radius:10px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);}
  .block.text{font-size:14px;line-height:1.55;overflow:hidden;}
  .block.text [contenteditable]{outline:none;height:100%;padding:12px 14px;overflow-y:auto;overflow-x:hidden;}
  .block.image{padding:0;overflow:hidden;}
  .block.image img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;}
  .block.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow-lg);z-index:5;}
  .block.dragging{box-shadow:var(--shadow-lg);z-index:6;}
  .block.snapping{transition:left .16s ease,top .16s ease;}
  .block .handle{position:absolute;right:-1px;bottom:-1px;width:16px;height:16px;border-radius:3px 3px 5px 3px;background:var(--accent);border:2px solid #fff;cursor:nwse-resize;display:none;}
  .block.selected .handle{display:block;}
  .block .del{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:#e23b53;color:#fff;border:2px solid #fff;font-size:13px;font-weight:700;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;box-shadow:0 1px 5px rgba(0,0,0,.45);z-index:8;}
  .block:hover .del,.block.selected .del{display:flex;}
  .block .grip{position:absolute;left:8px;right:24px;top:-9px;height:12px;border-radius:6px;background:var(--accent);opacity:0;cursor:grab;transition:opacity .12s;}
  .block:hover .grip,.block.selected .grip{opacity:.55;}
  .block .grip:active{cursor:grabbing;}

  /* image annotation: drawing overlay + caption band + annotate toolbar */
  .block.image .markup{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .block.image.draw-on .markup{pointer-events:auto;cursor:crosshair;}
  .block.image.draw-on img{cursor:crosshair;}
  .block .caption{position:absolute;left:0;right:0;bottom:0;display:none;padding:6px 10px;
    background:rgba(20,20,30,.62);color:#fff;font-size:13px;line-height:1.4;outline:none;border-radius:0 0 10px 10px;}
  .block .caption:not(:empty){display:block;}
  .block.selected .caption{display:block;}
  .block .caption:empty::before{content:"Add caption…";color:rgba(255,255,255,.6);}
  .block .annotate{position:absolute;left:6px;top:6px;display:none;gap:4px;padding:4px;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow-lg);z-index:7;}
  .block.image.selected .annotate{display:flex;}
  .block .annotate button{width:24px;height:24px;border:1px solid var(--line);background:var(--panel);border-radius:6px;
    cursor:pointer;font-size:13px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;}
  .block .annotate button:hover{border-color:var(--accent);}
  .block .annotate [data-draw].active{background:var(--accent-soft);border-color:var(--accent);}
  .block .annotate .sw{border-radius:50%;}

  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#323130;color:#fff;padding:9px 15px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:var(--shadow-lg);}
  #toast.show{opacity:1;}
  #test-output{display:none;white-space:pre-wrap;font-family:Consolas,monospace;font-size:13px;padding:16px;}
  #test-output.tests-pass{color:#0b6a0b;} #test-output.tests-fail{color:#a4262c;}
</style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="logo">A</div>
      <div class="brand"><h1>All Da Notes</h1><span class="version" id="appVersion"></span></div>
      <div class="searchbox">
        <input class="search" id="search" type="search" placeholder="Search pages…" disabled>
        <span id="searchCount" class="search-count"></span>
      </div>
      <div class="spacer"></div>
      <div id="status" class="status"><span class="dot"></span><span id="statusText">No folder</span></div>
      <button id="restoreBtn" style="display:none"></button>
      <button id="openBtn">Open notes folder</button>
    </div>
    <div id="banner"></div>
    <div class="panes">
      <div class="col col-nav">
        <div class="col-head"><span>Notebooks</span><button id="addNotebookBtn" title="Add notebook">＋</button></div>
        <div class="list" id="nbList"></div>
        <div class="col-head"><span>Sections</span><button id="addSectionBtn" title="Add section">＋</button></div>
        <div class="list" id="secList"></div>
        <div class="update-status" id="updateStatus"></div>
      </div>
      <div class="col col-pages">
        <div class="col-head"><span>Pages</span><button id="addPageBtn" title="Add page">＋</button></div>
        <div class="list" id="pageList"></div>
      </div>
      <div class="col col-editor">
        <div class="titlebar"><input id="pageTitle" placeholder="Page title" disabled></div>
        <div class="toolbar">
          <button data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
          <button data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
          <button data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
          <button data-block="H1" title="Heading 1">H1</button>
          <button data-block="H2" title="Heading 2">H2</button>
          <button data-block="P" title="Normal text">¶</button>
          <button data-cmd="insertUnorderedList" title="Bulleted list">•</button>
          <button data-cmd="insertOrderedList" title="Numbered list">1.</button>
          <input type="color" id="foreColor" title="Text color" value="#c00000">
          <input type="color" id="hiliteColor" title="Highlight" value="#ffff00">
        </div>
        <div class="canvasWrap" id="canvasWrap">
          <div class="page disabled" id="canvas"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <pre id="test-output"></pre>

<script>
"use strict";

// ===== VERSION / UPDATE CHECK =====
const APP_VERSION = "1.1.0";
// Points at the VERSION file in the GitHub repo (raw). NOTE: raw.githubusercontent.com
// only serves this without auth if the repo is PUBLIC; for a private repo the fetch 404s
// and the footer shows "Update check unavailable". Leave empty to disable the check.
const UPDATE_CHECK_URL = "https://raw.githubusercontent.com/carljohnson-vz/all-da-notes/main/VERSION";

// Extract a dotted version (e.g. "1.2.3") from raw text or a releases JSON payload.
function parseLatestVersion(text) {
  if (text == null) return null;
  const s = String(text).trim();
  try {
    const j = JSON.parse(s);
    const obj = Array.isArray(j) ? j[0] : j;
    const cand = obj && (obj.tag_name || obj.version || obj.latest || obj.name);
    if (cand) { const m = String(cand).match(/\d+(?:\.\d+)*/); if (m) return m[0]; }
  } catch (e) { /* not JSON — fall through to plain-text scan */ }
  const m = s.match(/\d+(?:\.\d+)*/);
  return m ? m[0] : null;
}

// Compare dotted version strings: 1 if a>b, -1 if a<b, 0 if equal.
function compareVersions(a, b) {
  const pa = String(a).split("."), pb = String(b).split(".");
  const n = Math.max(pa.length, pb.length);
  for (let i = 0; i < n; i++) {
    const x = parseInt(pa[i], 10) || 0, y = parseInt(pb[i], 10) || 0;
    if (x > y) return 1;
    if (x < y) return -1;
  }
  return 0;
}

// ===== UTILS =====
function slugify(title) {
  const base = String(title)
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
  return base || "untitled";
}

function uniqueSlug(base, taken) {
  const set = new Set(taken);
  if (!set.has(base)) return base;
  let n = 2;
  while (set.has(base + "-" + n)) n++;
  return base + "-" + n;
}
function genId(prefix) {
  return prefix + "_" + Math.random().toString(36).slice(2, 8);
}
function nowISO() {
  return new Date().toISOString();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function debounce(fn, ms) {
  let t = null;
  return function () {
    const ctx = this, args = arguments;
    clearTimeout(t);
    t = setTimeout(() => fn.apply(ctx, args), ms);
  };
}
function throttle(fn, ms) {
  let last = 0, timer = null;
  return function () {
    const ctx = this, args = arguments;
    const now = Date.now();
    const remaining = ms - (now - last);
    if (remaining <= 0) {
      last = now;
      fn.apply(ctx, args);
    } else if (!timer) {
      timer = setTimeout(() => { last = Date.now(); timer = null; fn.apply(ctx, args); }, remaining);
    }
  };
}

// ===== INDEX =====
function emptyIndex() {
  return { version: 1, notebooks: [] };
}
function serializeIndex(index) {
  return JSON.stringify(index, null, 2);
}
function validateIndex(obj) {
  return !!obj && obj.version === 1 && Array.isArray(obj.notebooks);
}
function parseIndex(text) {
  const obj = JSON.parse(text);
  if (!validateIndex(obj)) throw new Error("invalid index shape");
  return obj;
}

// ===== MODEL =====
function findNotebook(index, nbId) {
  return index.notebooks.find(n => n.id === nbId) || null;
}
function findSection(index, nbId, secId) {
  const nb = findNotebook(index, nbId);
  return nb ? (nb.sections.find(s => s.id === secId) || null) : null;
}
function findPage(index, nbId, secId, pgId) {
  const sec = findSection(index, nbId, secId);
  return sec ? (sec.pages.find(p => p.id === pgId) || null) : null;
}
function pagePath(nbSlug, secSlug, pgSlug) {
  return nbSlug + "/" + secSlug + "/" + pgSlug + ".html";
}
function addNotebook(index, title) {
  const slug = uniqueSlug(slugify(title), index.notebooks.map(n => n.slug));
  const nb = { id: genId("nb"), title: title, slug: slug, order: index.notebooks.length, sections: [] };
  index.notebooks.push(nb);
  return nb;
}
function addSection(index, notebookId, title) {
  const nb = findNotebook(index, notebookId);
  if (!nb) throw new Error("notebook not found: " + notebookId);
  const slug = uniqueSlug(slugify(title), nb.sections.map(s => s.slug));
  const sec = { id: genId("sec"), title: title, slug: slug, order: nb.sections.length, pages: [] };
  nb.sections.push(sec);
  return sec;
}
function addPage(index, notebookId, sectionId, title) {
  const nb = findNotebook(index, notebookId);
  if (!nb) throw new Error("notebook not found: " + notebookId);
  const sec = nb.sections.find(s => s.id === sectionId);
  if (!sec) throw new Error("section not found: " + sectionId);
  const slug = uniqueSlug(slugify(title), sec.pages.map(p => p.slug));
  const ts = nowISO();
  const pg = { id: genId("pg"), title: title, slug: slug,
               path: pagePath(nb.slug, sec.slug, slug), order: sec.pages.length,
               created: ts, modified: ts };
  sec.pages.push(pg);
  return pg;
}

function recomputePaths(index) {
  for (const nb of index.notebooks)
    for (const sec of nb.sections)
      for (const pg of sec.pages)
        pg.path = pagePath(nb.slug, sec.slug, pg.slug);
}
function collectPagePaths(index) {
  const map = {};
  for (const nb of index.notebooks)
    for (const sec of nb.sections)
      for (const pg of sec.pages)
        map[pg.id] = pg.path;
  return map;
}
function diffPaths(before, after) {
  const changes = [];
  for (const id in after)
    if (before[id] && before[id] !== after[id])
      changes.push({ id: id, from: before[id], to: after[id] });
  return changes;
}

function renameNotebook(index, id, newTitle) {
  const nb = findNotebook(index, id);
  if (!nb) throw new Error("notebook not found: " + id);
  const siblings = index.notebooks.filter(n => n !== nb).map(n => n.slug);
  nb.title = newTitle;
  nb.slug = uniqueSlug(slugify(newTitle), siblings);
  recomputePaths(index);
}
function renameSection(index, notebookId, id, newTitle) {
  const nb = findNotebook(index, notebookId);
  if (!nb) throw new Error("notebook not found: " + notebookId);
  const sec = nb.sections.find(s => s.id === id);
  if (!sec) throw new Error("section not found: " + id);
  const siblings = nb.sections.filter(s => s !== sec).map(s => s.slug);
  sec.title = newTitle;
  sec.slug = uniqueSlug(slugify(newTitle), siblings);
  recomputePaths(index);
}
function renamePage(index, notebookId, sectionId, id, newTitle) {
  const sec = findSection(index, notebookId, sectionId);
  if (!sec) throw new Error("section not found: " + sectionId);
  const pg = sec.pages.find(p => p.id === id);
  if (!pg) throw new Error("page not found: " + id);
  const siblings = sec.pages.filter(p => p !== pg).map(p => p.slug);
  pg.title = newTitle;
  pg.slug = uniqueSlug(slugify(newTitle), siblings);
  pg.modified = nowISO();
  recomputePaths(index);
}

function deleteNotebook(index, id) {
  const i = index.notebooks.findIndex(n => n.id === id);
  if (i < 0) throw new Error("notebook not found: " + id);
  return index.notebooks.splice(i, 1)[0];
}
function deleteSection(index, notebookId, id) {
  const nb = findNotebook(index, notebookId);
  if (!nb) throw new Error("notebook not found: " + notebookId);
  const i = nb.sections.findIndex(s => s.id === id);
  if (i < 0) throw new Error("section not found: " + id);
  return nb.sections.splice(i, 1)[0];
}
function deletePage(index, notebookId, sectionId, id) {
  const sec = findSection(index, notebookId, sectionId);
  if (!sec) throw new Error("section not found: " + sectionId);
  const i = sec.pages.findIndex(p => p.id === id);
  if (i < 0) throw new Error("page not found: " + id);
  return sec.pages.splice(i, 1)[0];
}

// ===== SEARCH =====
function filterPagesByTitle(index, query) {
  const q = String(query || "").trim().toLowerCase();
  const results = [];
  for (const nb of index.notebooks)
    for (const sec of nb.sections)
      for (const pg of sec.pages)
        if (!q || pg.title.toLowerCase().indexOf(q) !== -1)
          results.push({ notebookId: nb.id, sectionId: sec.id, page: pg });
  return results;
}

// Plain text of a page's stored HTML (tags stripped) — used for content search.
function pageText(html) {
  const d = new DOMParser().parseFromString(html || "", "text/html");
  return (d.body && d.body.textContent) || "";
}

// True if a page's title OR its text content contains the query (case-insensitive).
function pageMatches(title, html, query) {
  const q = String(query || "").toLowerCase();
  if (!q) return false;
  return String(title || "").toLowerCase().indexOf(q) !== -1 ||
         pageText(html).toLowerCase().indexOf(q) !== -1;
}

// ===== BLOCKS =====
function serializePage(blocks) {
  return blocks.map(b => {
    const style = "left:" + b.x + "px;top:" + b.y + "px;width:" + b.w + "px;height:" + b.h + "px;";
    let inner;
    if (b.type === "image") {
      inner = '<img src="' + b.content + '">' +
              '<svg class="markup" viewBox="0 0 100 100" preserveAspectRatio="none">' + (b.drawing || "") + '</svg>' +
              '<div class="caption">' + (b.caption || "") + '</div>';
    } else {
      inner = b.content;
    }
    return '<div class="block" data-type="' + b.type + '" style="' + style + '">' + inner + '</div>';
  }).join("\n");
}

function _pxNum(style, prop) {
  const m = new RegExp(prop + "\\s*:\\s*(-?\\d+(?:\\.\\d+)?)px").exec(style || "");
  return m ? Math.round(parseFloat(m[1])) : 0;
}

function parsePage(html) {
  const doc = new DOMParser().parseFromString(
    "<body>" + (html || "") + "</body>", "text/html");
  const els = doc.querySelectorAll(".block");
  if (els.length === 0) {
    const body = (html || "").trim();
    if (!body) return [];
    return [{ type: "text", x: 24, y: 24, w: 720, h: 300, content: body }];
  }
  const blocks = [];
  els.forEach(el => {
    const type = el.getAttribute("data-type") === "image" ? "image" : "text";
    const style = el.getAttribute("style") || "";
    const x = _pxNum(style, "left"), y = _pxNum(style, "top");
    const w = _pxNum(style, "width"), h = _pxNum(style, "height");
    if (type === "image") {
      const img = el.querySelector("img");
      const content = img ? img.getAttribute("src") || "" : "";
      const svg = el.querySelector("svg.markup");
      const drawing = svg ? svg.innerHTML.trim() : "";
      const capEl = el.querySelector(".caption");
      const caption = capEl ? capEl.innerHTML : "";
      blocks.push({ type: "image", x: x, y: y, w: w, h: h, content: content, drawing: drawing, caption: caption });
    } else {
      blocks.push({ type: "text", x: x, y: y, w: w, h: h, content: el.innerHTML });
    }
  });
  return blocks;
}

function clampResize(block, others, candW, candH, canvasW, canvasH) {
  let w = Math.max(80, Math.min(candW, canvasW - block.x));
  let h = Math.max(48, Math.min(candH, canvasH - block.y));
  for (const o of others) {
    // vertical overlap in the block's row and neighbour to the right -> limit width
    if (o.y < block.y + h && o.y + o.h > block.y && o.x > block.x)
      w = Math.min(w, o.x - block.x);
    // horizontal overlap in the block's column and neighbour below -> limit height
    if (o.x < block.x + w && o.x + o.w > block.x && o.y > block.y)
      h = Math.min(h, o.y - block.y);
  }
  return { w: Math.max(80, w), h: Math.max(48, h) };
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

function resolveDrag(moving, others, cand, canvasW, canvasH) {
  const w = moving.w, h = moving.h;
  const nx = Math.max(0, Math.min(cand.x, canvasW - w));
  const ny = Math.max(0, Math.min(cand.y, canvasH - h));
  const hits = r => others.some(o => rectsOverlap(r, o));
  if (!hits({ x: nx, y: ny, w: w, h: h }) && !hits({ x: nx, y: moving.y, w: w, h: h })) return { x: nx, y: ny };
  if (!hits({ x: moving.x, y: ny, w: w, h: h })) return { x: moving.x, y: ny };
  if (!hits({ x: nx, y: moving.y, w: w, h: h })) return { x: nx, y: moving.y };
  return { x: moving.x, y: moving.y };
}

// On drop: keep the dropped position if it doesn't overlap; otherwise return the
// nearest position (expanding square-ring search) where the block fits without overlap.
function nearestFreeSpot(rect, others, canvasW, canvasH) {
  const w = rect.w, h = rect.h;
  const clampX = x => Math.max(0, Math.min(x, Math.max(0, canvasW - w)));
  const clampY = y => Math.max(0, Math.min(y, Math.max(0, canvasH - h)));
  const free = (x, y) => !others.some(o => rectsOverlap({ x: x, y: y, w: w, h: h }, o));
  const x0 = clampX(rect.x), y0 = clampY(rect.y);
  if (free(x0, y0)) return { x: x0, y: y0 };
  const STEP = 8, MAX = Math.max(canvasW, canvasH) + h;
  const consider = (cx, cy, acc) => {
    const x = clampX(cx), y = clampY(cy);
    if (free(x, y)) { const d = (x - x0) * (x - x0) + (y - y0) * (y - y0); if (d < acc.d) { acc.d = d; acc.best = { x: x, y: y }; } }
  };
  for (let r = STEP; r <= MAX; r += STEP) {
    const acc = { best: null, d: Infinity };
    for (let dx = -r; dx <= r; dx += STEP) { consider(rect.x + dx, rect.y - r, acc); consider(rect.x + dx, rect.y + r, acc); }
    for (let dy = -r + STEP; dy <= r - STEP; dy += STEP) { consider(rect.x - r, rect.y + dy, acc); consider(rect.x + r, rect.y + dy, acc); }
    if (acc.best) return acc.best;
  }
  return { x: x0, y: y0 };
}

const Blocks = {
  canvas: null,
  blocks: [],          // [{id,type,x,y,w,h,content,el}]
  selectedId: null,
  onChange: null,
  lastClick: { x: 40, y: 40 },

  init(canvasEl, onChange) {
    Blocks.canvas = canvasEl;
    Blocks.onChange = onChange;
    Blocks.bindCanvas();
    Blocks.bindPaste();
  },
  setEnabled(on) { Blocks.canvas.classList.toggle("disabled", !on); },

  clear() {
    Blocks.blocks = [];
    Blocks.selectedId = null;
    Blocks.canvas.innerHTML = "";
    Blocks._growCanvas();
  },

  load(html) {
    Blocks.clear();
    parsePage(html).forEach(rec => Blocks._add(rec, false));
    Blocks._growCanvas();
  },

  serialize() {
    return serializePage(Blocks.blocks.map(b => {
      if (b.type === "image") {
        const svg = b.el && b.el.querySelector("svg.markup");
        const capEl = b.el && b.el.querySelector(".caption");
        return { type: "image", x: b.x, y: b.y, w: b.w, h: b.h, content: b.content,
                 drawing: svg ? svg.innerHTML.trim() : (b.drawing || ""),
                 caption: capEl ? (capEl.textContent.trim() === "" ? "" : capEl.innerHTML) : (b.caption || "") };
      }
      return { type: "text", x: b.x, y: b.y, w: b.w, h: b.h, content: Blocks._contentOf(b) };
    }));
  },

  _contentOf(b) {
    const ce = b.el ? b.el.querySelector("[contenteditable]") : null;
    return ce ? ce.innerHTML : b.content;
  },

  _add(rec, fireChange) {
    const b = { id: genId("blk"), type: rec.type, x: rec.x, y: rec.y, w: rec.w, h: rec.h, content: rec.content,
                drawing: rec.drawing || "", caption: rec.caption || "", el: null };
    Blocks.blocks.push(b);
    Blocks._render(b);
    Blocks._growCanvas();
    if (fireChange && Blocks.onChange) Blocks.onChange();
    return b;
  },

  _render(b) {
    const el = document.createElement("div");
    el.className = "block " + b.type;
    el.dataset.id = b.id;
    el.style.left = b.x + "px"; el.style.top = b.y + "px";
    el.style.width = b.w + "px"; el.style.height = b.h + "px";
    if (b.type === "image") {
      const img = document.createElement("img"); img.src = b.content; el.appendChild(img);
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "markup");
      svg.setAttribute("viewBox", "0 0 100 100");
      svg.setAttribute("preserveAspectRatio", "none");
      svg.innerHTML = b.drawing || "";
      el.appendChild(svg);
      const cap = document.createElement("div");
      cap.className = "caption"; cap.setAttribute("contenteditable", "true");
      cap.innerHTML = b.caption || "";
      cap.addEventListener("focus", () => Editor.setActive(cap));
      cap.addEventListener("input", () => {
        if (cap.textContent.trim() === "" && cap.innerHTML !== "") cap.innerHTML = ""; // drop stray <br>
        if (Blocks.onChange) Blocks.onChange();
      });
      el.appendChild(cap);
      Blocks._attachAnnotate(b, el, svg);
    } else {
      const ce = document.createElement("div");
      ce.setAttribute("contenteditable", "true");
      ce.innerHTML = b.content || "";
      ce.addEventListener("focus", () => Editor.setActive(ce));
      ce.addEventListener("input", () => { if (Blocks.onChange) Blocks.onChange(); });
      el.appendChild(ce);
    }
    const del = document.createElement("button"); del.className = "del"; del.textContent = "✕"; del.title = "Delete block";
    const handle = document.createElement("div"); handle.className = "handle";
    el.appendChild(del); el.appendChild(handle);
    const grip = document.createElement("div"); grip.className = "grip"; grip.title = "Drag to move";
    el.appendChild(grip);
    b.el = el;
    Blocks.canvas.appendChild(el);
    Blocks._attachSelect(b); Blocks._attachDrag(b); Blocks._attachResize(b);
    del.addEventListener("pointerdown", e => { e.stopPropagation(); });
    del.addEventListener("click", e => { e.stopPropagation(); Blocks.remove(b.id); });
  },

  _others(except) {
    return Blocks.blocks.filter(b => b.id !== except).map(b => ({ x: b.x, y: b.y, w: b.w, h: b.h }));
  },
  _findFreeSpot(x, y, w, h) {
    const cw = Blocks.canvas.clientWidth;
    const nx = Math.max(0, Math.min(x, Math.max(0, cw - w)));
    let ny = Math.max(0, y);
    const others = Blocks._others(null);
    let guard = 0;
    while (others.some(o => rectsOverlap({ x: nx, y: ny, w: w, h: h }, o)) && guard++ < 500) ny += 24;
    return { x: nx, y: ny };
  },
  _growCanvas() {
    let maxBottom = 0;
    for (const b of Blocks.blocks) maxBottom = Math.max(maxBottom, b.y + b.h);
    Blocks.canvas.style.height = (maxBottom + 120) + "px";
  },
  _byId(id) { return Blocks.blocks.find(b => b.id === id) || null; },

  drawingId: null,
  drawColor: "#1f2430",

  select(id) {
    if (Blocks.drawingId && Blocks.drawingId !== id) Blocks._setDraw(Blocks._byId(Blocks.drawingId), false);
    Blocks.selectedId = id;
    Blocks.blocks.forEach(b => b.el.classList.toggle("selected", b.id === id));
  },
  deselect() {
    if (Blocks.drawingId) Blocks._setDraw(Blocks._byId(Blocks.drawingId), false);
    Blocks.selectedId = null;
    Blocks.blocks.forEach(b => b.el.classList.remove("selected"));
  },
  _setDraw(b, on) {
    if (!b) return;
    Blocks.drawingId = on ? b.id : (Blocks.drawingId === b.id ? null : Blocks.drawingId);
    b.el.classList.toggle("draw-on", on);
    const btn = b.el.querySelector(".annotate [data-draw]");
    if (btn) btn.classList.toggle("active", on);
  },
  _attachAnnotate(b, el, svg) {
    const bar = document.createElement("div");
    bar.className = "annotate";
    bar.innerHTML =
      '<button data-draw title="Draw on image">✏️</button>' +
      '<button class="sw" data-color="#1f2430" style="background:#1f2430" title="Black"></button>' +
      '<button class="sw" data-color="#e0697a" style="background:#e0697a" title="Red"></button>' +
      '<button class="sw" data-color="#2f6fed" style="background:#2f6fed" title="Blue"></button>' +
      '<button data-undo title="Undo stroke">⤺</button>' +
      '<button data-clear title="Clear drawing">🗑</button>';
    el.appendChild(bar);
    bar.addEventListener("pointerdown", e => e.stopPropagation());
    bar.querySelector("[data-draw]").addEventListener("click", e => {
      e.stopPropagation();
      Blocks._setDraw(b, Blocks.drawingId !== b.id);
    });
    bar.querySelectorAll(".sw").forEach(sw => sw.addEventListener("click", e => {
      e.stopPropagation();
      Blocks.drawColor = sw.getAttribute("data-color");
      if (Blocks.drawingId !== b.id) Blocks._setDraw(b, true);
    }));
    bar.querySelector("[data-undo]").addEventListener("click", e => {
      e.stopPropagation();
      const last = svg.querySelector("path:last-of-type");
      if (last) { last.remove(); if (Blocks.onChange) Blocks.onChange(); }
    });
    bar.querySelector("[data-clear]").addEventListener("click", e => {
      e.stopPropagation();
      if (svg.childNodes.length) { svg.innerHTML = ""; if (Blocks.onChange) Blocks.onChange(); }
    });
    Blocks._attachDraw(b, svg);
  },
  _attachDraw(b, svg) {
    svg.addEventListener("pointerdown", e => {
      if (Blocks.drawingId !== b.id || e.button !== 0) return;
      e.preventDefault(); e.stopPropagation();
      const r = svg.getBoundingClientRect();
      const pt = ev => Math.round((ev.clientX - r.left) / r.width * 1000) / 10 + " " +
                       Math.round((ev.clientY - r.top) / r.height * 1000) / 10;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", "M" + pt(e));
      path.setAttribute("stroke", Blocks.drawColor);
      path.setAttribute("stroke-width", "3");
      path.setAttribute("fill", "none");
      path.setAttribute("vector-effect", "non-scaling-stroke");
      path.setAttribute("stroke-linecap", "round");
      path.setAttribute("stroke-linejoin", "round");
      svg.appendChild(path);
      svg.setPointerCapture(e.pointerId);
      const move = ev => path.setAttribute("d", path.getAttribute("d") + "L" + pt(ev));
      const up = () => {
        svg.releasePointerCapture(e.pointerId);
        svg.removeEventListener("pointermove", move);
        svg.removeEventListener("pointerup", up);
        svg.removeEventListener("pointercancel", up);
        if (Blocks.onChange) Blocks.onChange();
      };
      svg.addEventListener("pointermove", move);
      svg.addEventListener("pointerup", up);
      svg.addEventListener("pointercancel", up);
    });
  },
  _attachSelect(b) {
    b.el.addEventListener("pointerdown", () => Blocks.select(b.id));
  },
  _attachDrag(b) {
    b.el.addEventListener("pointerdown", e => {
      // don't start a drag from the resize handle, delete button, while editing text,
      // while annotating (draw mode), or from the annotate toolbar
      if (Blocks.drawingId === b.id) return;
      if (e.target.closest && e.target.closest(".annotate")) return;
      if (e.target.classList.contains("handle") || e.target.classList.contains("del")) return;
      if (e.target.isContentEditable) return;
      if (e.button !== 0) return;
      e.preventDefault();
      const sx = e.clientX, sy = e.clientY, ox = b.x, oy = b.y;
      b.el.setPointerCapture(e.pointerId);
      b.el.classList.add("dragging");
      const move = ev => {
        // free movement: follow the cursor, clamped to the canvas, overlap allowed
        const cw = Blocks.canvas.clientWidth, ch = Blocks.canvas.clientHeight;
        b.x = Math.max(0, Math.min(ox + (ev.clientX - sx), Math.max(0, cw - b.w)));
        b.y = Math.max(0, Math.min(oy + (ev.clientY - sy), Math.max(0, ch - b.h)));
        b.el.style.left = b.x + "px"; b.el.style.top = b.y + "px";
      };
      const up = ev => {
        b.el.releasePointerCapture(e.pointerId);
        b.el.classList.remove("dragging");
        b.el.removeEventListener("pointermove", move);
        b.el.removeEventListener("pointerup", up);
        b.el.removeEventListener("pointercancel", up);
        // on drop: keep if it fits, else snap to the nearest non-overlapping spot
        const bound = Math.max(Blocks.canvas.clientHeight, b.y + b.h + 8);
        const pos = nearestFreeSpot({ x: b.x, y: b.y, w: b.w, h: b.h }, Blocks._others(b.id),
                                    Blocks.canvas.clientWidth, bound);
        if (pos.x !== b.x || pos.y !== b.y) {
          b.el.classList.add("snapping");
          setTimeout(() => b.el.classList.remove("snapping"), 180);
          b.x = pos.x; b.y = pos.y;
          b.el.style.left = b.x + "px"; b.el.style.top = b.y + "px";
        }
        Blocks._growCanvas();
        if (Blocks.onChange) Blocks.onChange();
      };
      b.el.addEventListener("pointermove", move);
      b.el.addEventListener("pointerup", up);
      b.el.addEventListener("pointercancel", up);
    });
  },
  _attachResize(b) {
    const handle = b.el.querySelector(".handle");
    handle.addEventListener("pointerdown", e => {
      e.preventDefault(); e.stopPropagation();
      Blocks.select(b.id);
      const sx = e.clientX, sy = e.clientY, ow = b.w, oh = b.h;
      const ratio = b.type === "image" ? ow / oh : 0;
      handle.setPointerCapture(e.pointerId);
      const move = ev => {
        let cw = ow + (ev.clientX - sx);
        let ch = oh + (ev.clientY - sy);
        if (ratio) ch = Math.round(cw / ratio); // images keep aspect ratio
        const size = clampResize({ x: b.x, y: b.y, w: b.w, h: b.h }, Blocks._others(b.id),
                                 cw, ch, Blocks.canvas.clientWidth, Blocks.canvas.clientHeight);
        b.w = size.w; b.h = size.h;
        b.el.style.width = b.w + "px"; b.el.style.height = b.h + "px";
      };
      const up = ev => {
        handle.releasePointerCapture(e.pointerId);
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", up);
        handle.removeEventListener("pointercancel", up);
        Blocks._growCanvas();
        if (Blocks.onChange) Blocks.onChange();
      };
      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", up);
      handle.addEventListener("pointercancel", up);
    });
  },
  remove(id) {
    const b = Blocks._byId(id);
    if (!b) return;
    b.el.remove();
    Blocks.blocks = Blocks.blocks.filter(x => x.id !== id);
    if (Blocks.selectedId === id) Blocks.selectedId = null;
    if (Blocks.drawingId === id) Blocks.drawingId = null;
    Blocks._growCanvas();
    if (Blocks.onChange) Blocks.onChange();
  },
  addTextAt(x, y) {
    const pos = Blocks._findFreeSpot(x, y, 320, 180);
    const b = Blocks._add({ type: "text", x: pos.x, y: pos.y, w: 320, h: 180, content: "" }, true);
    Blocks.select(b.id);
    const ce = b.el.querySelector("[contenteditable]");
    if (ce) ce.focus();
    return b;
  },
  bindCanvas() {
    // double-click empty canvas -> new text block at that point
    Blocks.canvas.addEventListener("dblclick", e => {
      if (e.target !== Blocks.canvas) return; // only empty space
      if (Blocks.canvas.classList.contains("disabled")) return;
      const r = Blocks.canvas.getBoundingClientRect();
      Blocks.addTextAt(Math.round(e.clientX - r.left), Math.round(e.clientY - r.top));
    });
    // click empty canvas -> deselect; track last click point for paste
    Blocks.canvas.addEventListener("pointerdown", e => {
      if (e.target !== Blocks.canvas) return;
      const r = Blocks.canvas.getBoundingClientRect();
      Blocks.lastClick = { x: Math.round(e.clientX - r.left), y: Math.round(e.clientY - r.top) };
      Blocks.deselect();
    });
    // Delete key removes the selected block (unless editing text)
    document.addEventListener("keydown", e => {
      if ((e.key === "Delete" || e.key === "Backspace") && Blocks.selectedId) {
        if (document.activeElement && document.activeElement.isContentEditable) return;
        e.preventDefault();
        Blocks.remove(Blocks.selectedId);
      }
    });
  },
  bindPaste() {
    document.addEventListener("paste", e => {
      if (Blocks.canvas.classList.contains("disabled")) return;
      // If editing text, let the browser handle the paste normally.
      if (document.activeElement && document.activeElement.isContentEditable) return;
      const items = (e.clipboardData && e.clipboardData.items) || [];
      for (const it of items) {
        if (it.type && it.type.indexOf("image") === 0) {
          const file = it.getAsFile();
          if (!file) continue;
          e.preventDefault();
          const reader = new FileReader();
          reader.onload = () => Blocks._addImageDataUri(reader.result);
          reader.readAsDataURL(file);
          return;
        }
      }
      // non-image paste onto the canvas background: ignore gracefully
    });
  },
  _addImageDataUri(dataUri) {
    const img = new Image();
    img.onload = () => {
      const maxW = Blocks.canvas.clientWidth - 48;
      let w = img.naturalWidth || 240, h = img.naturalHeight || 160;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const pos = Blocks._findFreeSpot(Blocks.lastClick.x, Blocks.lastClick.y, w, h);
      const b = Blocks._add({ type: "image", x: pos.x, y: pos.y, w: w, h: h, content: dataUri }, true);
      Blocks.select(b.id);
    };
    img.src = dataUri;
  },
};

// ===== STORAGE =====
const IDB_DB = "onenote-lite", IDB_STORE = "handles", IDB_KEY = "rootDir";

function idbOpen() {
  return new Promise((resolve, reject) => {
    let req;
    try { req = indexedDB.open(IDB_DB, 1); }
    catch (e) { reject(e); return; }
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, val) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const r = tx.objectStore(IDB_STORE).get(key);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

const Storage = {
  supported() {
    return typeof window.showDirectoryPicker === "function";
  },
  async pickFolder() {
    return await window.showDirectoryPicker({ mode: "readwrite" });
  },
  async saveHandle(handle) {
    try { await idbSet(IDB_KEY, handle); return true; } catch (e) { return false; }
  },
  async loadHandle() {
    try { return (await idbGet(IDB_KEY)) || null; } catch (e) { return null; }
  },
  async verifyPermission(handle, write) {
    const opts = { mode: write ? "readwrite" : "read" };
    if ((await handle.queryPermission(opts)) === "granted") return true;
    if ((await handle.requestPermission(opts)) === "granted") return true;
    return false;
  },
  _split(relPath) {
    const i = relPath.lastIndexOf("/");
    return { dir: i < 0 ? "" : relPath.slice(0, i), name: i < 0 ? relPath : relPath.slice(i + 1) };
  },
  async getDir(root, relDir, create) {
    let dir = root;
    if (!relDir) return dir;
    for (const part of relDir.split("/").filter(Boolean))
      dir = await dir.getDirectoryHandle(part, { create: !!create });
    return dir;
  },
  async writeFile(root, relPath, contents) {
    const p = Storage._split(relPath);
    const d = await Storage.getDir(root, p.dir, true);
    const fh = await d.getFileHandle(p.name, { create: true });
    const w = await fh.createWritable();
    await w.write(contents);
    await w.close();
  },
  async readFile(root, relPath) {
    const p = Storage._split(relPath);
    const d = await Storage.getDir(root, p.dir, false);
    const fh = await d.getFileHandle(p.name, { create: false });
    return await (await fh.getFile()).text();
  },
  async deleteFile(root, relPath) {
    const p = Storage._split(relPath);
    const d = await Storage.getDir(root, p.dir, false);
    await d.removeEntry(p.name);
  },
  async movePage(root, from, to) {
    if (from === to) return;
    const content = await Storage.readFile(root, from);
    await Storage.writeFile(root, to, content);
    try { await Storage.deleteFile(root, from); } catch (e) { /* best effort */ }
  },
  async removeDir(root, relDir) {
    const p = Storage._split(relDir);
    const parent = await Storage.getDir(root, p.dir, false);
    await parent.removeEntry(p.name, { recursive: true });
  },
  async readIndex(root) {
    try { return parseIndex(await Storage.readFile(root, "index.json")); }
    catch (e) { return null; }
  },
  async writeIndex(root, index) {
    await Storage.writeFile(root, "index.json", serializeIndex(index));
  },
  async scanTree(root) {
    const index = emptyIndex();
    for await (const entry of root.entries()) {
      const nbName = entry[0], nbHandle = entry[1];
      if (nbHandle.kind !== "directory") continue;
      const nb = { id: genId("nb"), title: nbName, slug: nbName, order: index.notebooks.length, sections: [] };
      for await (const sEntry of nbHandle.entries()) {
        const secName = sEntry[0], secHandle = sEntry[1];
        if (secHandle.kind !== "directory") continue;
        const sec = { id: genId("sec"), title: secName, slug: secName, order: nb.sections.length, pages: [] };
        for await (const fEntry of secHandle.entries()) {
          const fName = fEntry[0], fHandle = fEntry[1];
          if (fHandle.kind === "file" && fName.slice(-5) === ".html") {
            const slug = fName.slice(0, -5);
            const ts = nowISO();
            sec.pages.push({ id: genId("pg"), title: slug, slug: slug,
              path: pagePath(nbName, secName, slug), order: sec.pages.length, created: ts, modified: ts });
          }
        }
        nb.sections.push(sec);
      }
      index.notebooks.push(nb);
    }
    return index;
  }
};

const Editor = {
  activeEl: null,      // the focused block's contenteditable element
  onChange: null,
  init(onChange) { Editor.onChange = onChange; },
  setActive(el) { Editor.activeEl = el; },
  exec(cmd, value) {
    if (!Editor.activeEl) return;
    Editor.activeEl.focus();
    document.execCommand(cmd, false, value);
    if (Editor.onChange) Editor.onChange();
  },
  bindToolbar() {
    document.querySelectorAll(".toolbar button[data-cmd]").forEach(btn => {
      btn.addEventListener("mousedown", e => e.preventDefault());
      btn.addEventListener("click", () => Editor.exec(btn.getAttribute("data-cmd")));
    });
    document.querySelectorAll(".toolbar button[data-block]").forEach(btn => {
      btn.addEventListener("mousedown", e => e.preventDefault());
      btn.addEventListener("click", () => Editor.exec("formatBlock", "<" + btn.getAttribute("data-block").toLowerCase() + ">"));
    });
    const fore = document.getElementById("foreColor");
    fore.addEventListener("change", () => Editor.exec("foreColor", fore.value));
    const hil = document.getElementById("hiliteColor");

};

// ===== VIEW =====
const View = {
  render(app) {
    View._renderNotebooks(app);
    View._renderSections(app);
    View._renderPages(app);
    View._renderEditorHeader(app);
  },
  _list(el, items, selectedId, onSelect, onRename, onDelete) {
    el.innerHTML = "";
    for (const it of items) {
      const row = document.createElement("div");
      row.className = "item" + (it.id === selectedId ? " selected" : "");
      const label = document.createElement("span");
      label.textContent = it.title;
      const menu = document.createElement("button");
      menu.className = "menu"; menu.textContent = "⋯"; menu.title = "Rename / Delete";
      row.appendChild(label); row.appendChild(menu);
      row.addEventListener("click", e => { if (e.target !== menu) onSelect(it.id); });
      menu.addEventListener("click", e => {
        e.stopPropagation();
        const action = window.prompt('Type "r" to rename or "d" to delete "' + it.title + '"', "r");
        if (action === "r") {
          const name = window.prompt("New name:", it.title);
          if (name && name.trim()) onRename(it.id, name.trim());
        } else if (action === "d") {
          if (window.confirm('Delete "' + it.title + '" and everything in it?')) onDelete(it.id);
        }
      });
      el.appendChild(row);
    }
  },
  _renderNotebooks(app) {
    View._list(document.getElementById("nbList"), app.index.notebooks, app.sel.notebookId,
      id => app.selectNotebook(id), (id, n) => app.renameNotebookUI(id, n), id => app.deleteNotebookUI(id));
  },
  _renderSections(app) {
    const nb = findNotebook(app.index, app.sel.notebookId);
    View._list(document.getElementById("secList"), nb ? nb.sections : [], app.sel.sectionId,
      id => app.selectSection(id), (id, n) => app.renameSectionUI(id, n), id => app.deleteSectionUI(id));
  },
  _renderPages(app) {
    const el = document.getElementById("pageList");
    const sec = findSection(app.index, app.sel.notebookId, app.sel.sectionId);
    View._list(el, sec ? sec.pages : [], app.sel.pageId,
      id => app.selectPage(id), (id, n) => app.renamePageUI(id, n), id => app.deletePageUI(id));
  },
  _renderEditorHeader(app) {
    const titleEl = document.getElementById("pageTitle");
    const pg = findPage(app.index, app.sel.notebookId, app.sel.sectionId, app.sel.pageId);
    titleEl.disabled = !pg;
    titleEl.value = pg ? pg.title : "";
    Blocks.setEnabled(!!pg);
  },
};

// ===== APP =====
const App = {
  root: null,
  index: emptyIndex(),
  sel: { notebookId: null, sectionId: null, pageId: null },

  async init() {
    document.getElementById("appVersion").textContent = "v" + APP_VERSION;
    App.checkForUpdates();   // fire-and-forget; shows status in the nav footer
    if (!Storage.supported()) {
      App.showBanner("This app needs the File System Access API. Please open it in Google Chrome or Microsoft Edge.");
      document.getElementById("openBtn").disabled = true;
      return;
    }
    Blocks.init(document.getElementById("canvas"), App.onEditorChange);
    Editor.init(App.onEditorChange);
    Editor.bindToolbar();
    App.bindChrome();
    // Best-effort restore of last folder.
    const handle = await Storage.loadHandle();
    if (handle) {
      try {
        // Zero-click only if the browser already remembers the grant.
        if ((await handle.queryPermission({ mode: "readwrite" })) === "granted") {
          await App.useRoot(handle);
          return;
        }
        // Otherwise offer a one-click reopen (the gesture the API requires).
        App._offerReopen(handle);
        App.setStatus("No folder");
        return;
      } catch (e) { /* fall through to manual open */ }
    }
    App.setStatus("No folder");
  },

  bindChrome() {
    document.getElementById("openBtn").addEventListener("click", () => App.openFolder());
    document.getElementById("addNotebookBtn").addEventListener("click", () => App.onAddNotebook());
    document.getElementById("addSectionBtn").addEventListener("click", () => App.onAddSection());
    document.getElementById("addPageBtn").addEventListener("click", () => App.onAddPage());
    const search = document.getElementById("search");
    search.addEventListener("input", () => {
      App._clearHighlight();
      if (!search.value.trim()) App._clearSearch();   // emptied -> reset counter/state
      else App._searchQ = null;                       // query changed -> recompute on next Enter
      App._updateCount();
    });
    search.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); App.runSearch(); }
    });
    document.getElementById("pageTitle").addEventListener("change", () => App.onTitleEdit());
    window.addEventListener("beforeunload", () => App.flushPending());
    document.addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
        e.preventDefault();
        App.flushPending();
        App.toast("Saved");
      }
    });
    // clear a search highlight as soon as the user does anything other than search
    document.addEventListener("pointerdown", e => {
      if (!e.target.closest || !e.target.closest(".searchbox")) App._clearHighlight();
    });
  },

  async openFolder() {
    let handle;
    try { handle = await Storage.pickFolder(); }
    catch (e) { return; } // user cancelled
    await Storage.saveHandle(handle); // best effort; may be no-op on opaque origin
    await App.useRoot(handle);
  },

  async useRoot(handle) {
    await App.flushPending();
    App.root = handle;
    App.hideBanner();
    document.getElementById("restoreBtn").style.display = "none";
    let idx = await Storage.readIndex(handle);
    if (!idx) {
      // No/corrupt index: rebuild from folder scan (empty for a fresh folder).
      idx = await Storage.scanTree(handle);
      await Storage.writeIndex(handle, idx);
    }
    App.index = idx;
    App.sel = { notebookId: null, sectionId: null, pageId: null };
    // Auto-select first notebook/section/page if present.
    const nb = idx.notebooks[0];
    if (nb) {
      App.sel.notebookId = nb.id;
      const sec = nb.sections[0];
      if (sec) {
        App.sel.sectionId = sec.id;
        if (sec.pages[0]) App.sel.pageId = sec.pages[0].id;
      }
    }
    document.getElementById("search").disabled = false;
    App.setStatus("Saved");
    await App.loadCurrentPageIntoEditor();
    View.render(App);
  },

  setStatus(text) {
    document.getElementById("statusText").textContent = text;
    const el = document.getElementById("status");
    el.className = "status" + (text === "Saved" ? " saved" : text === "Saving…" ? " saving" : text === "Unsaved" ? " unsaved" : "");
  },
  showBanner(msg) { const b = document.getElementById("banner"); b.textContent = msg; b.style.display = "block"; },
  hideBanner() { document.getElementById("banner").style.display = "none"; },
  toast(msg) {
    const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2200);
  },
  _offerReopen(handle) {
    const btn = document.getElementById("restoreBtn");
    btn.textContent = "Reopen " + (handle.name || "last folder");
    btn.style.display = "";
    btn.onclick = async () => {
      try {
        if (await Storage.verifyPermission(handle, true)) {
          btn.style.display = "none";
          await App.useRoot(handle);
        }
      } catch (e) { App.toast("Couldn't reopen folder"); }
    };
  },
};

App.renameWithMove = async function (mutate) {
  if (!App.requireRoot()) return;
  await App.flushPending();
  const before = collectPagePaths(App.index);
  mutate();
  const after = collectPagePaths(App.index);
  const changes = diffPaths(before, after);
  await App.safeWrite(async () => {
    for (const c of changes) await Storage.movePage(App.root, c.from, c.to);
  });
  await App.persistIndex();
  await App.afterSelectionChange();

// ---- cross-content search (title + page text), jump-to-match with counter ----
App._searchQ = null;     // the query the current _matches were computed for
App._matches = [];       // [{notebookId, sectionId, pageId}] in document order
App._matchIdx = 0;
App._searchSeq = 0;      // epoch guard against overlapping async searches

App.runSearch = async function () {
  if (!App.root) return;
  const q = document.getElementById("search").value.trim().toLowerCase();
  if (!q) { App._clearSearch(); return; }
  await App.flushPending();              // persist current edits before searching + navigating
  const seq = ++App._searchSeq;
  if (q !== App._searchQ) {
    const matches = await App._collectMatches(q);
    if (seq !== App._searchSeq) return;  // a newer search superseded this one
    App._searchQ = q;
    App._matches = matches;
    App._matchIdx = 0;
  } else if (App._matches.length) {
    App._matchIdx = (App._matchIdx + 1) % App._matches.length;   // Enter again -> next
  }
  App._updateCount();
  if (App._matches.length) await App._gotoMatch(App._matches[App._matchIdx], q);
};

App._collectMatches = async function (q) {
  const res = [];
  for (const nb of App.index.notebooks)
    for (const sec of nb.sections)
      for (const pg of sec.pages) {
        let html = "";
        try { html = await Storage.readFile(App.root, pg.path); } catch (e) { html = ""; }
        if (pageMatches(pg.title, html, q))
          res.push({ notebookId: nb.id, sectionId: sec.id, pageId: pg.id });
      }
  return res;
};

App._gotoMatch = async function (m, q) {
  App._clearHighlight();
  App.sel = { notebookId: m.notebookId, sectionId: m.sectionId, pageId: m.pageId };
  await App.afterSelectionChange();   // loads the page into the canvas + renders
  App._highlight(q);
};

App._updateCount = function () {
  const el = document.getElementById("searchCount");
  if (!el) return;
  if (!App._searchQ) { el.textContent = ""; return; }
  const n = App._matches.length;
  el.textContent = n ? (App._matchIdx + 1) + "/" + n : "0/0";
};

App._clearSearch = function () {
  App._searchQ = null; App._matches = []; App._matchIdx = 0;
  App._clearHighlight();
  App._updateCount();
};

App._highlight = function (q) {
  App._clearHighlight();
  if (!q || typeof Highlight === "undefined" || !window.CSS || !CSS.highlights) return;
  const root = document.getElementById("canvas");
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const ranges = [];
  let node;
  while ((node = walker.nextNode())) {
    const hay = node.nodeValue.toLowerCase();
    let i = hay.indexOf(q);
    while (i !== -1) {
      const r = document.createRange();
      r.setStart(node, i); r.setEnd(node, i + q.length);
      ranges.push(r);
      i = hay.indexOf(q, i + q.length);
    }
  }
  if (ranges.length) {
    CSS.highlights.set("search-hl", new Highlight(...ranges));
    const host = ranges[0].startContainer.parentElement;
    if (host && host.scrollIntoView) host.scrollIntoView({ block: "center", inline: "nearest" });
  }
};

App._clearHighlight = function () {
  if (window.CSS && CSS.highlights) CSS.highlights.delete("search-hl");
};

App.checkForUpdates = async function () {
  const el = document.getElementById("updateStatus");
  if (!el) return;
  if (!UPDATE_CHECK_URL) { el.textContent = ""; return; }   // not configured yet
  el.textContent = "Checking for updates…";
  try {
    const resp = await fetch(UPDATE_CHECK_URL, { cache: "no-store" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const latest = parseLatestVersion(await resp.text());
    if (!latest) { el.textContent = "Update check unavailable"; return; }
    el.textContent = compareVersions(latest, APP_VERSION) > 0 ? "Not running latest version" : "Up To Date";
  } catch (e) {
    el.textContent = "Update check unavailable";
  }
};

App._pageSaveTimer = null;
App._pendingPageId = null;

App.onEditorChange = function () {
  const pg = findPage(App.index, App.sel.notebookId, App.sel.sectionId, App.sel.pageId);
  if (!pg || !App.root) return;
  App._pendingPageId = pg.id;
  App.setStatus("Unsaved");
  clearTimeout(App._pageSaveTimer);
  App._pageSaveTimer = setTimeout(() => App.savePage(pg), 800);
};

App.savePage = async function (pg) {
  if (!App.root || !pg) return;
  // Bail if the page was deleted since the save was scheduled.
  let stillExists = false;
  for (const nb of App.index.notebooks)
    for (const sec of nb.sections)
      for (const p of sec.pages)
        if (p.id === pg.id) stillExists = true;
  if (!stillExists) return;
  const path = pg.path;
  const html = Blocks.serialize();
  App.setStatus("Saving…");
  const ok = await App.safeWrite(async () => {
    await Storage.writeFile(App.root, path, html);
    pg.modified = nowISO();
    await Storage.writeIndex(App.root, App.index);
  });
  if (ok) App.setStatus("Saved");
};

App.flushPending = async function () {
  if (!App._pendingPageId) return;
  clearTimeout(App._pageSaveTimer);
  const id = App._pendingPageId;
  App._pendingPageId = null;
  let pg = null;
  for (const nb of App.index.notebooks)
    for (const sec of nb.sections)
      for (const p of sec.pages)
        if (p.id === id) pg = p;
  if (pg) await App.savePage(pg);
};

App.persistIndex = async function () {
  if (!App.root) return;
  await App.safeWrite(() => Storage.writeIndex(App.root, App.index));
};

App.safeWrite = async function (fn) {
  try { await fn(); return true; }
  catch (e) {
    App.setStatus("Unsaved");
    App.toast("Save failed: " + (e && e.message ? e.message : e));
    return false;
  }
};

const TESTS = [];
function test(name, fn) { TESTS.push({ name: name, fn: fn }); }
function assert(cond, msg) { if (!cond) throw new Error(msg || "assertion failed"); }
function assertEqual(got, expected, msg) {
  const g = JSON.stringify(got), e = JSON.stringify(expected);
  if (g !== e) throw new Error((msg ? msg + " — " : "") + "expected " + e + " but got " + g);
}
function assertThrows(fn, msg) {
  let threw = false;
  try { fn(); } catch (e) { threw = true; }
  if (!threw) throw new Error(msg || "expected function to throw");
}

test("parseLatestVersion reads a plain version string", () => assertEqual(parseLatestVersion("1.2.3"), "1.2.3"));

test("rectsOverlap true when overlapping", () =>

test("rectsOverlap false when disjoint", () =>
  assert(rectsOverlap({x:0,y:0,w:50,h:50}, {x:60,y:60,w:50,h:50}) === false));
test("rectsOverlap false when edges touch", () =>
  assert(rectsOverlap({x:0,y:0,w:50,h:50}, {x:50,y:0,w:50,h:50}) === false));
test("rectsOverlap true when nested", () =>
  assert(rectsOverlap({x:0,y:0,w:200,h:200}, {x:20,y:20,w:30,h:30}) === true));

function runTests() {
  let pass = 0, fail = 0; const lines = [];
  for (const t of TESTS) {
    try { t.fn(); pass++; lines.push("PASS  " + t.name); }
    catch (e) { fail++; lines.push("FAIL  " + t.name + "\n        " + e.message); }
  }
  const el = document.getElementById("test-output");
  el.textContent = "Tests: " + pass + " passed, " + fail + " failed\n\n" + lines.join("\n");
  el.className = fail ? "tests-fail" : "tests-pass";
}

// ===== BOOT =====
(function boot() {
  const params = new URLSearchParams(location.search);
  if (params.get("test")) {
    document.getElementById("app").style.display = "none";
    document.getElementById("test-output").style.display = "block";
    runTests();
  } else {
    App.init();
  }
})();
</script>
